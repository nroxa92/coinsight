name: coinsight
description: "CoinSight — AI-powered cryptocurrency signal detector. Monitors new listings, analyzes with Claude AI, executes Binance Spot orders. Open source."
publish_to: 'none'
version: 3.0.0+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # HTTP & API
  http: ^1.4.0
  # State management
  provider: ^6.1.0
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Utilities
  intl: ^0.20.0
  # Notifications
  flutter_local_notifications: ^18.0.0
  # Crypto (HMAC-SHA256 for Binance signing)
  crypto: ^3.0.3
  convert: ^3.1.1
  # Intelligence sources
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
